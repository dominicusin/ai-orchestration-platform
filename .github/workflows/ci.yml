name: AI Pipeline CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          
      - name: Run linter
        run: |
          source .venv/bin/activate
          ruff check orchestration/
          
      - name: Type check
        run: |
          source .venv/bin/activate
          mypy orchestration/ --ignore-missing-imports || true
          
      - name: Test imports
        run: |
          source .venv/bin/activate
          python -c "from orchestration.pipeline import run_pipeline"
          python -c "from orchestration.ai.providers import get_provider_manager"
          
  docker:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker build -t ai-pipeline:test .
        
      - name: Test container
        run: |
          docker run -d --name test-pipeline -p 8888:8080 ai-pipeline:test sleep 10
          docker logs test-pipeline
          docker stop test-pipeline

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to server
        run: |
          echo "Deploy steps here"
          # scp files to server
          # docker-compose up -d
