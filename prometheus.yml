# Prometheus configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'pipeline'
    static_configs:
      - targets: ['pipeline:9090']
        labels:
          service: 'ai-pipeline'
  
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
        labels:
          service: 'redis'

  - job_name: 'postgres'
    static_configs:
      - targets: ['db:5432']
        labels:
          service: 'postgres'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
