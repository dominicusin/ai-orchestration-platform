version: '3.8'

services:
  pipeline:
    build: .
    container_name: ai-pipeline
    ports:
      - "8080:8080"
      - "11434:11434"
      - "9090:9090"
    environment:
      - OLLAMA_MODEL=gemma3:1b
      - LOG_FORMAT=json
      - DEFAULT_PROVIDER=ollama
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./OpenPapyrus:/app/OpenPapyrus
      - ./Surypus2:/app/Surypus2
      - ollama:/root/.ollama
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ai-pipeline-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: ai-pipeline-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped

volumes:
  ollama:
  redis_data:
  prometheus_data: