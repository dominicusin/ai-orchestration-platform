version: '3.8'

services:
  pipeline:
    build: .
    container_name: ai-pipeline
    ports:
      - "8080:8080"
      - "11434:11434"
    environment:
      - OLLAMA_MODEL=gemma3:1b
      - LOG_FORMAT=json
      - DEFAULT_PROVIDER=ollama
    volumes:
      - ./OpenPapyrus:/app/OpenPapyrus
      - ./Surypus2:/app/Surypus2
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Optional: Groq API proxy
  # groq-proxy:
  #   image: ghcr.io/groq/groq-proxy:latest
  #   ports:
  #     - "8081:8081"
  #   environment:
  #     - GROQ_API_KEY=${GROQ_API_KEY}

volumes:
  ollama:
