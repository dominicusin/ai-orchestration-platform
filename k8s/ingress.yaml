apiVersion: v1
kind: Namespace
metadata:
  name: ai-pipeline
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-pipeline-ingress
  namespace: ai-pipeline
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: ai-pipeline.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-pipeline-service
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus-ingress
  namespace: ai-pipeline
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: prometheus.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus-service
                port:
                  number: 9090
