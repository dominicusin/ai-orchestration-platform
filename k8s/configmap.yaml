apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-pipeline-config
  namespace: ai-pipeline
data:
  LOG_FORMAT: "json"
  DEFAULT_PROVIDER: "ollama"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: ai-pipeline-secret
  namespace: ai-pipeline
type: Opaque
stringData:
  # Add your API keys here
  # GROQ_API_KEY: ""
  # ANTHROPIC_API_KEY: ""
  # OPENAI_API_KEY: ""
